name: images

# Every ALE image is published once per version and never again. The version each image
# is at, and a hash of the sources it was built from, live in
# packages/ale-run/src/ale/run/releases.json; a version the registry already has is
# skipped, so a published release can never change under the Tasks pinned to it.

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'packages/ale-run/src/ale/run/releases.json'
  pull_request:
    paths:
      - 'images/**'
      - 'packages/ale-run/src/ale/run/releases.json'
  workflow_dispatch:
    inputs:
      promote_repository:
        description: Publish an existing image under a version (repository, e.g. container-ubuntu22-base)
        required: false
        default: ''
      promote_source:
        description: The existing image, as a tag or sha256 digest
        required: false
        default: ''
      promote_version:
        description: The version to publish it as (X.Y.Z, never already published)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  plan:
    if: github.event_name != 'workflow_dispatch' || inputs.promote_repository == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      releases: ${{ steps.plan.outputs.releases }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: plan
        run: echo "releases=$(python3 packages/ale-run/src/ale/run/releases.py --json)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.plan.outputs.releases) }}
    env:
      IMAGE: ghcr.io/agentslastexam/${{ matrix.release.repository }}
      VERSION: ${{ matrix.release.version }}
      CONTENT: ${{ matrix.release.content }}
      INPUTS: ${{ matrix.release.inputs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Same-repository runs log in so private images can be checked; a fork's run only
      # builds, and an image it cannot see is simply built again.
      - name: Log in to GHCR
        if: >-
          github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the release
        id: release
        run: |
          read -r -a inputs <<<"$INPUTS"
          content=$(git ls-files -s -- "${inputs[@]}" | sha256sum | cut -c1-12)
          if [[ "$content" != "$CONTENT" ]]; then
            echo "::error::${IMAGE##*/} sources changed since $VERSION; give it a new version in releases.json"
            exit 1
          fi
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "$IMAGE:$VERSION is already published and stays as it is"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        if: steps.release.outputs.published == 'false'
        with:
          context: ${{ matrix.release.context }}
          file: ${{ matrix.release.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:${{ env.CONTENT }}
          labels: |
            ale.content_hash=${{ env.CONTENT }}
            ale.image_version=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Give an image that was published without a version (such as an old content tag) its
  # version, by pointing a new tag at the very same manifest. Nothing is rebuilt.
  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.promote_repository != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      REPOSITORY: ${{ inputs.promote_repository }}
      SOURCE: ${{ inputs.promote_source }}
      VERSION: ${{ inputs.promote_version }}
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the existing image under its version
        run: |
          [[ "$REPOSITORY" =~ ^[a-z0-9-]+$ ]] || { echo "::error::invalid repository"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must be X.Y.Z"; exit 1; }
          image="ghcr.io/agentslastexam/$REPOSITORY"
          case "$SOURCE" in
            sha256:*) source="$image@$SOURCE" ;;
            *) source="$image:$SOURCE" ;;
          esac
          if docker buildx imagetools inspect "$image:$VERSION" >/dev/null 2>&1; then
            echo "::error::$image:$VERSION is already published; a version never changes"
            exit 1
          fi
          docker buildx imagetools create --tag "$image:$VERSION" "$source"
          docker buildx imagetools inspect "$image:$VERSION"
